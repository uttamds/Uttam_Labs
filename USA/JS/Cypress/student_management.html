<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #007bff;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        button {
            padding: 6px 14px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h2>Student Management Portal</h2>

    <table id="studentTable">

        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Department</th>
                <th>Semester</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>CSE</td>
                <td>6</td>
                <td>Active</td>
                <td><button>Edit</button></td>
            </tr>

            <tr>
                <td>102</td>
                <td>Priya</td>
                <td>ISE</td>
                <td>6</td>
                <td>Inactive</td>
                <td><button>Edit</button></td>
            </tr>

            <tr>
                <td>103</td>
                <td>Amit</td>
                <td>ECE</td>
                <td>5</td>
                <td>Active</td>
                <td><button>Edit</button></td>
            </tr>

            <tr>
                <td>104</td>
                <td>Sneha</td>
                <td>ME</td>
                <td>7</td>
                <td>Active</td>
                <td><button>Edit</button></td>
            </tr>

            <tr>
                <td>105</td>
                <td>Kiran</td>
                <td>CSE</td>
                <td>5</td>
                <td>Inactive</td>
                <td><button>Edit</button></td>
            </tr>

        </tbody>

    </table>

</body>

</html>
